<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1k61 - Ngôi Nhà Chung</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Màn hình khóa có gắn ảnh nền từ máy */
        .lock-screen {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('nen.png') no-repeat center center/cover;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Canvas pháo bông */
        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Các icon sách vở trang trí nền */
        .school-icon {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.3;
            animation: floatIcons 6s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes floatIcons {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(15deg); }
        }

        /* Hiệu ứng ngôi sao lấp lánh ngẫu nhiên */
        .star-sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8, 0 0 20px #38bdf8;
            animation: twinkle 2s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Khung bọc chữ và banner chào mừng lên cao hơn */
        .title-wrapper {
            position: relative;
            transform: translateY(-90px);
            z-index: 3;
            text-align: center;
        }

        .class-title::before {
            content: "★ 𝓦𝓮𝓵𝓬𝓸𝓶𝓮 𝓽𝓸 ★";
            display: block;
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: 4px;
            margin-bottom: 8px;
            text-transform: lowercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .class-title {
            font-size: 6.5vw; 
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7),
                         0 0 35px rgba(56, 189, 248, 0.5);
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
        }

        .sub-slogan {
            color: #cbd5e1;
            font-size: 1.2rem;
            letter-spacing: 1.5px;
            font-weight: 500;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            margin-top: 5px;
        }

        /* Nút chuyển sang trangchu.html */
        .btn-enter {
            display: inline-block;
            padding: 16px 45px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.5);
            transition: all 0.3s ease;
            transform: translateY(-20px);
            z-index: 3;
            position: relative;
        }

        .btn-enter:hover {
            transform: translateY(-25px) scale(1.08);
            box-shadow: 0 15px 35px rgba(129, 140, 248, 0.8);
            background: linear-gradient(135deg, #818cf8, #38bdf8);
            border-color: #fff;
        }

        .btn-enter:active {
            transform: translateY(-20px) scale(0.98);
        }
    </style>
</head>
<body>

    <div class="lock-screen">
        <!-- Canvas vẽ pháo bông -->
        <canvas id="fireworks-canvas"></canvas>

        <!-- Các icon trang trí nền -->
        <div class="school-icon" style="top: 12%; left: 8%; animation-delay: 0s;">📚</div>
        <div class="school-icon" style="top: 18%; right: 10%; animation-delay: 1s;">✏️</div>
        <div class="school-icon" style="top: 72%; left: 10%; animation-delay: 2s;">🎒</div>
        <div class="school-icon" style="top: 78%; right: 12%; animation-delay: 1.5s;">📐</div>
        <div class="school-icon" style="top: 48%; left: 4%; animation-delay: 2.5s;">📝</div>
        <div class="school-icon" style="top: 42%; right: 6%; animation-delay: 0.5s;">🎓</div>

        <!-- Các ngôi sao lấp lánh -->
        <div class="star-sparkle" style="top: 20%; left: 25%; animation-delay: 0.2s;"></div>
        <div class="star-sparkle" style="top: 15%; right: 28%; animation-delay: 0.8s;"></div>
        <div class="star-sparkle" style="top: 55%; left: 20%; animation-delay: 1.2s;"></div>
        <div class="star-sparkle" style="top: 60%; right: 22%; animation-delay: 0.5s;"></div>

        <!-- Cụm tiêu đề -->
        <div class="title-wrapper">
            <h1 class="class-title">A1k61</h1>
            <div class="sub-slogan">TEST thôi mn ạ☺️</div>
        </div>

        <!-- Nút liên kết sang trangchu.html -->
        <a href="trangchu.html" class="btn-enter">bước vô=)))</a>
    </div>

    <!-- Script pháo bông và điều hướng -->
    <script>
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.010;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];

        function addFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.5);
            const colors = ['#38bdf8', '#818cf8', '#f472b6', '#fb7185', '#34d399', '#facc15'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
        setInterval(addFirework, 900);
    </script>

</body>
</html>
