<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Kỷ Niệm - A1K61</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3.2rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.15rem;
            color: #f472b6;
            font-weight: 600;
        }

        /* Lưới hiển thị tối ưu, gọn gàng, tự khớp kích thước */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .gallery-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .gallery-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(56, 189, 248, 0.25);
        }

        /* Ảnh và video full kích cỡ khung, hiển thị trọn vẹn */
        .gallery-card img, 
        .gallery-card video {
            width: 100%;
            height: 240px;
            object-fit: cover; /* Giữ khung gọn gàng, không bị bóp méo hình */
            display: block;
            background: #000;
        }

        .card-info {
            padding: 14px;
            text-align: center;
            color: #e2e8f0;
            font-size: 0.95rem;
            font-weight: 600;
            background: #1e293b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .empty-notice {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: #64748b;
            font-style: italic;
            font-size: 1.1rem;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 20px auto 0;
            padding: 12px 30px;
            background: linear-gradient(135deg, #475569, #1e293b);
            color: #f8fafc;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Góc Kỷ Niệm A1K61 ✨</h1>
            <p>Tự động cập nhật từ kho ảnh của lớp!</p>
        </header>

        <!-- Lưới chứa ảnh/video -->
        <div class="gallery-grid" id="galleryGrid">
            <div class="empty-notice">Đang tải khoảnh khắc lớp mình... 🚀</div>
        </div>

        <a href="trangchu.html" class="back-btn">⬅ Quay lại trang chủ</a>
    </div>

    <script>
        async function loadGallery() {
            try {
                // Đọc file data.json được sinh ra từ script quét
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Chưa có dữ liệu');
                
                const items = await response.json();
                const grid = document.getElementById('galleryGrid');
                grid.innerHTML = '';

                if (items.length === 0) {
                    grid.innerHTML = `<div class="empty-notice">Thư mục images chưa có ảnh hoặc video nào cả!</div>`;
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'gallery-card';

                    let mediaElement = '';
                    if (item.type === 'video') {
                        mediaElement = `<video src="${item.url}" controls muted></video>`;
                    } else {
                        mediaElement = `<img src="${item.url}" alt="${item.filename}" loading="lazy">`;
                    }

                    card.innerHTML = `
                        ${mediaElement}
                        <div class="card-info">${item.title}</div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                document.getElementById('galleryGrid').innerHTML = `
                    <div class="empty-notice">Thg dev nó thêm ảnh vào thì ở đây khác hiện</div>
                `;
            }
        }

        loadGallery();
    </script>

</body>
</html>
