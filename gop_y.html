<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Góp Ý - A1K61</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.8rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.05rem;
            color: #f472b6;
            font-weight: 600;
        }

        .feedback-form {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #38bdf8;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #38bdf8;
        }

        .form-group textarea {
            resize: vertical;
            height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        #status-message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 10px 25px;
            background: linear-gradient(135deg, #475569, #1e293b);
            color: #f8fafc;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Góc Góp Ý 📮</h1>
            <p>Có ý kiến hay "bóc phốt" gì thì gửi thẳng về máy dev nhé!</p>
        </header>

        <!-- Form gửi dữ liệu -->
        <form class="feedback-form" id="feedbackForm" action="https://formspree.io/f/ma_endpoint_cua_ong" method="POST">
            <div class="form-group">
                <label for="name">Tên đồng chí (hoặc ẩn danh):</label>
                <input type="text" id="name" name="name" placeholder="Ví dụ: Kẻ bí ẩn..." required>
            </div>

            <div class="form-group">
                <label for="message">Nội dung góp ý / Ý tưởng:</label>
                <textarea id="message" name="message" placeholder="Nhập nội dung vào đây..." required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Gửi Ngay 🚀</button>
            <div id="status-message"></div>
        </form>

        <a href="trangchu.html" class="back-btn">⬅ Quay lại trang chủ</a>
    </div>

    <script>
        // Xử lý hiệu ứng gửi form mượt mà không bị chuyển trang đột ngột
        const form = document.getElementById("feedbackForm");
        
        async function handleSubmit(event) {
            event.preventDefault();
            const status = document.getElementById("status-message");
            const btn = document.getElementById("submitBtn");
            
            btn.disabled = true;
            btn.textContent = "Đang gửi...";
            
            const data = new FormData(event.target);
            
            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: {
                    'Accept': 'json'
                }
            }).then(response => {
                if (response.ok) {
                    status.style.color = "#34d399";
                    status.textContent = "Gửi thành công! Đã chuyển thẳng đến Gmail của Dev 🎉";
                    form.reset();
                } else {
                    response.json().then(data => {
                        status.style.color = "#f43f5e";
                        if (Object.hasOwn(data, 'errors')) {
                            status.textContent = data["errors"].map(error => error["message"]).join(", ");
                        } else {
                            status.textContent = "Oops! Có lỗi xảy ra, thử lại sau nhé.";
                        }
                    })
                }
                btn.disabled = false;
                btn.textContent = "Gửi Ngay 🚀";
            }).catch(error => {
                status.style.color = "#f43f5e";
                status.textContent = "Lỗi kết nối mạng rồi ông ơi!";
                btn.disabled = false;
                btn.textContent = "Gửi Ngay 🚀";
            });
        }
        
        form.addEventListener("submit", handleSubmit);
    </script>

</body>
</html>
