<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Góp Ý - A1K61</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.8rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.05rem;
            color: #f472b6;
            font-weight: 600;
        }

        .feedback-form {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #38bdf8;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #38bdf8;
        }

        .form-group textarea {
            resize: vertical;
            height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .submit-btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        #status-message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 10px 25px;
            background: linear-gradient(135deg, #475569, #1e293b);
            color: #f8fafc;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            transform: scale(1.05);
        }

        /* --- MUSIC WIDGET (GÓC TRÁI) --- */
        #music-widget {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 9999;
        }

        .music-toggle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #0f172a;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: all 0.3s ease;
        }

        .music-toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.7);
        }

        #music-widget.playing .vinyl-icon {
            animation: spinVinyl 3s linear infinite;
        }

        @keyframes spinVinyl {
            100% { transform: rotate(360deg); }
        }

        .music-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 280px;
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        #music-widget.active .music-panel {
            display: flex;
            animation: slideUpPanel 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #music-widget.active .music-toggle-btn {
            display: none;
        }

        @keyframes slideUpPanel {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .music-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .music-header h4 {
            color: #38bdf8;
            font-size: 1rem;
        }

        .close-panel-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-panel-btn:hover {
            color: #f43f5e;
        }

        .now-playing {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .now-playing p {
            font-size: 0.85rem;
            color: #f472b6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }

        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            outline: none;
            appearance: none;
            cursor: pointer;
            transition: height 0.2s;
        }

        .progress-bar:hover {
            height: 8px;
        }

        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: #38bdf8;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .music-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .ctrl-btn {
            background: #334155;
            border: none;
            color: #f8fafc;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: scale(1.08);
        }

        .play-pause-btn {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
            font-weight: bold;
        }

        .playlist {
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 4px;
        }

        .playlist::-webkit-scrollbar {
            width: 4px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 2px;
        }

        .playlist-item {
            background: #0f172a;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #cbd5e1;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item:hover {
            border-color: #818cf8;
            color: #fff;
        }

        .playlist-item.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Góc Góp Ý 📮</h1>
            <p>Có ý kiến hay "bóc phốt" gì thì gửi thẳng về máy dev nhé!</p>
        </header>

        <!-- Form gửi dữ liệu -->
        <form class="feedback-form" id="feedbackForm" action="https://formspree.io/f/mkjgrnbz" method="POST">
            <div class="form-group">
                <label for="name">Tên (hoặc ẩn danh):</label>
                <input type="text" id="name" name="name" placeholder="VD: toi bi gay" required>
            </div>

            <div class="form-group">
                <label for="message">Nội dung góp ý / Ý tưởng:</label>
                <textarea id="message" name="message" placeholder="Nhập nội dung vào đây..." required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Vả vào mặt Dev</button>
            <div id="status-message"></div>
        </form>

        <a href="trangchu.html" class="back-btn">⬅ Quay lại trang chủ</a>
    </div>

    <!-- === MUSIC PLAYER BOX === -->
    <div id="music-widget">
        <button class="music-toggle-btn" id="musicToggleBtn" title="Chill">
            <span class="vinyl-icon">🎵</span>
        </button>

        <div class="music-panel">
            <div class="music-header">
                <h4>🎧 Chill</h4>
                <button class="close-panel-btn" id="closePanelBtn">×</button>
            </div>

            <div class="now-playing">
                <p id="current-song-title">Đang chọn bài...</p>
            </div>

            <div class="progress-container">
                <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100" step="0.1">
                <div class="time-info">
                    <span id="currentTime">00:00</span>
                    <span id="durationTime">00:00</span>
                </div>
            </div>

            <audio id="audio-player"></audio>

            <div class="music-controls">
                <button class="ctrl-btn" id="prevBtn" title="Bài trước">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="playPauseBtn" title="Phát/Dừng">▶</button>
                <button class="ctrl-btn" id="nextBtn" title="Bài tiếp">⏭</button>
            </div>

            <div class="playlist" id="playlistContainer"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById("feedbackForm");
        
        function checkDailyLimit() {
            const today = new Date().toDateString();
            let savedData = JSON.parse(localStorage.getItem('feedback_limit')) || { date: today, count: 0 };
            
            if (savedData.date !== today) {
                savedData = { date: today, count: 0 };
                localStorage.setItem('feedback_limit', JSON.stringify(savedData));
            }
            
            return savedData.count;
        }

        function incrementDailyCount() {
            const today = new Date().toDateString();
            let savedData = JSON.parse(localStorage.getItem('feedback_limit')) || { date: today, count: 0 };
            savedData.count += 1;
            localStorage.setItem('feedback_limit', JSON.stringify(savedData));
        }

        window.addEventListener('DOMContentLoaded', () => {
            const count = checkDailyLimit();
            const status = document.getElementById("status-message");
            const btn = document.getElementById("submitBtn");
            
            if (count >= 5) {
                btn.disabled = true;
                btn.textContent = "Hết lượt rồi";
                status.style.color = "#f43f5e";
                status.textContent = "Ông đã vả dev đủ 5 lần trong ngày rồi, mai quay lại nhé!";
            }
        });
        
        async function handleSubmit(event) {
            event.preventDefault();
            
            const currentCount = checkDailyLimit();
            const status = document.getElementById("status-message");
            const btn = document.getElementById("submitBtn");

            if (currentCount >= 5) {
                btn.disabled = true;
                btn.textContent = "Hết lượt góp ý hôm nay 🛑";
                status.style.color = "#f43f5e";
                status.textContent = "Đã quá hạn mức 5 lần/ngày!";
                return;
            }
            
            btn.disabled = true;
            btn.textContent = "Chờ xíu...";
            
            const data = new FormData(event.target);
            
            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: {
                    'Accept': 'json'
                }
            }).then(response => {
                if (response.ok) {
                    incrementDailyCount();
                    const newCount = checkDailyLimit();
                    
                    status.style.color = "#34d399";
                    status.textContent = `Thành công! Dev đã ăn vả (Còn ${5 - newCount} lượt hôm nay)`;
                    form.reset();
                    
                    if (newCount >= 5) {
                        btn.disabled = true;
                        btn.textContent = "Hết lượt góp ý hôm nay 🛑";
                    } else {
                        btn.disabled = false;
                        btn.textContent = "Vả vào mặt Dev";
                    }
                } else {
                    response.json().then(data => {
                        status.style.color = "#f43f5e";
                        if (Object.hasOwn(data, 'errors')) {
                            status.textContent = data["errors"].map(error => error["message"]).join(", ");
                        } else {
                            status.textContent = "Lỗi...";
                        }
                    })
                    btn.disabled = false;
                    btn.textContent = "Vả vào mặt Dev";
                }
            }).catch(error => {
                status.style.color = "#f43f5e";
                status.textContent = "Mạng kém vcl";
                btn.disabled = false;
                btn.textContent = "Vả vào mặt Dev";
            });
        }
        
        form.addEventListener("submit", handleSubmit);

        // --- SCRIPT XỬ LÝ NHẠC & SESSIONSTORAGE ---
        const musicWidget = document.getElementById('music-widget');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const closePanelBtn = document.getElementById('closePanelBtn');
        const audioPlayer = document.getElementById('audio-player');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const currentSongTitle = document.getElementById('current-song-title');
        const playlistContainer = document.getElementById('playlistContainer');
        
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        const playlist = [
            { title: "Tim Em - Hngle", src: "music/Tim Em.mp3" },
            { title: "Vet Thuong - fishy", src: "music/Vet thuong.mp3" }
        ];

        let currentTrackIndex = parseInt(sessionStorage.getItem('music_index')) || 0;
        let savedTime = parseFloat(sessionStorage.getItem('music_time')) || 0;
        let isPlaying = sessionStorage.getItem('music_playing') === 'true';
        audioPlayer.volume = 0.4;

        musicToggleBtn.addEventListener('click', () => {
            musicWidget.classList.add('active');
        });

        closePanelBtn.addEventListener('click', () => {
            musicWidget.classList.remove('active');
        });

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
                item.innerText = `${index + 1}. ${song.title}`;
                item.addEventListener('click', () => {
                    loadTrack(index, 0, true);
                });
                playlistContainer.appendChild(item);
            });
        }

        function loadTrack(index, startAt = 0, autoPlay = false) {
            currentTrackIndex = index;
            audioPlayer.src = playlist[index].src;
            currentSongTitle.innerText = playlist[index].title;
            
            audioPlayer.addEventListener('loadedmetadata', function() {
                audioPlayer.currentTime = startAt;
                if (autoPlay) {
                    playAudio();
                }
            }, { once: true });

            renderPlaylist();
            sessionStorage.setItem('music_index', currentTrackIndex);
        }

        function playAudio() {
            audioPlayer.play().then(() => {
                musicWidget.classList.add('playing');
                playPauseBtn.innerText = "⏸";
                sessionStorage.setItem('music_playing', 'true');
            }).catch(err => {
                console.log("Trình duyệt chờ người dùng tương tác.", err);
            });
        }

        function pauseAudio() {
            audioPlayer.pause();
            musicWidget.classList.remove('playing');
            playPauseBtn.innerText = "▶";
            sessionStorage.setItem('music_playing', 'false');
        }

        playPauseBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                playAudio();
            } else {
                pauseAudio();
            }
        });

        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex, 0, true);
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex, 0, true);
        });

        audioPlayer.addEventListener('ended', () => {
            nextBtn.click();
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
                
                if (!audioPlayer.paused) {
                    sessionStorage.setItem('music_time', audioPlayer.currentTime);
                }
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationTimeEl.innerText = formatTime(audioPlayer.duration);
        });

        progressBar.addEventListener('input', () => {
            if (audioPlayer.duration) {
                const seekTime = (progressBar.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = seekTime;
                sessionStorage.setItem('music_time', seekTime);
            }
        });

        loadTrack(currentTrackIndex, savedTime, isPlaying);

        let hasInteracted = false;
        function triggerAutoplayOnFirstInteraction() {
            if (!hasInteracted && isPlaying) {
                hasInteracted = true;
                playAudio();
                window.removeEventListener('click', triggerAutoplayOnFirstInteraction);
                window.removeEventListener('keydown', triggerAutoplayOnFirstInteraction);
                window.removeEventListener('touchstart', triggerAutoplayOnFirstInteraction);
            }
        }

        window.addEventListener('click', triggerAutoplayOnFirstInteraction);
        window.addEventListener('keydown', triggerAutoplayOnFirstInteraction);
        window.addEventListener('touchstart', triggerAutoplayOnFirstInteraction);
    </script>

</body>
</html>
