<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Thành Viên - A1K61</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3.2rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.15rem;
            color: #f472b6;
            font-weight: 600;
        }

        /* Lưới hiển thị thành viên */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .member-card {
            background: #1e293b;
            border-radius: 14px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            border-top: 4px solid #38bdf8;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .member-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(56, 189, 248, 0.3);
            border-top-color: #f43f5e;
        }

        .member-avatar {
            width: 70px;
            height: 70px;
            background: #334155;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border: 2px solid #38bdf8;
            object-fit: cover;
            overflow: hidden;
        }

        /* Nếu là thẻ ảnh thật thì phủ kín khung */
        .member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .member-card h3 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .member-card .member-id {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 20px auto 0;
            padding: 12px 30px;
            background: linear-gradient(135deg, #475569, #1e293b);
            color: #f8fafc;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Thành Viên A1K61 ✨</h1>
            <p>45 Mạng:</p>
        </header>

        <!-- Lưới danh sách học sinh -->
        <div class="member-grid"></div>

        <a href="trangchu.html" class="back-btn">⬅ Quay lại trang chủ</a>
    </div>

    <script>
        const grid = document.querySelector('.member-grid');
        
        // Danh sách 45 thành viên kèm link ảnh avatar riêng (nếu để trống "" thì web tự hiện icon 👤)
        const dsThanhVien = [
            { name: "Hoàng Phúc An", avatar: "" },
            { name: "Nguyễn Hoàng Anh", avatar: "images/avatar2.jpg" }, // Ví dụ bạn số 2 có ảnh
            { name: "Nguyễn Phương Anh", avatar: "" },
            { name: "Nguyễn Việt Anh", avatar: "" },
            { name: "Vi Thị Hoài Anh", avatar: "" },
            { name: "Nguyễn Văn Bách", avatar: "" },
            { name: "Bùi Hoàng Bảo", avatar: "" },
            { name: "Lưu Khánh Chi", avatar: "" },
            { name: "Vi Thị Ngọc Diệp", avatar: "" },
            { name: "Nguyễn Thị Hoa Dung", avatar: "" },
            { name: "Trịnh Phương Dung", avatar: "" },
            { name: "Vi Thùy Dung", avatar: "" },
            { name: "Vi Anh Đào", avatar: "" },
            { name: "Hoàng Tuấn Đạt", avatar: "" },
            { name: "Bùi Thị Ngọc Hà", avatar: "" },
            { name: "Lê Ngân Hà", avatar: "" },
            { name: "Trần Gia Hân", avatar: "" },
            { name: "Nông Thanh Hiền", avatar: "" },
            { name: "Vi Minh Hoàng", avatar: "" },
            { name: "Hoàng Việt Hùng", avatar: "" },
            { name: "Vũ Tuấn Kiệt", avatar: "" },
            { name: "Nguyễn Trọng Khôi", avatar: "" },
            { name: "Đường Hoàng Lâm", avatar: "" },
            { name: "Hoàng Thùy Linh", avatar: "" },
            { name: "Hoàng Vi Trúc Linh", avatar: "" },
            { name: "Nguyễn Trọng Lương", avatar: "" },
            { name: "Ngô Gia Minh", avatar: "" },
            { name: "Nguyễn Ngọc Bảo Minh", avatar: "" },
            { name: "Nguyễn Trúc Trà My", avatar: "" },
            { name: "Hoàng Thành Nam", avatar: "" },
            { name: "Vi Hữu Nghĩa", avatar: "" },
            { name: "Vũ Hoàng Bảo Ngọc", avatar: "" },
            { name: "Vi Yến Nhi", avatar: "" },
            { name: "Hoàng Quỳnh Như", avatar: "" },
            { name: "Mồng Khính Phương", avatar: "" },
            { name: "Vi Hải Phượng", avatar: "" },
            { name: "Nguyễn Minh Quân", avatar: "" },
            { name: "Vi Minh Tiến", avatar: "" },
            { name: "Hoàng Mạnh Tú", avatar: "" },
            { name: "Triệu Đức Tú", avatar: "" },
            { name: "Nguyễn Đình Tuấn", avatar: "" },
            { name: "Dương Diệu Thảo", avatar: "" },
            { name: "Lành Phương Thảo", avatar: "" },
            { name: "Trần Thanh Trúc", avatar: "" },
            { name: "Trần Hải Yến", avatar: "" }
        ];

        // Tự động dựng thẻ card, nếu có link ảnh thì hiện ảnh, không thì hiện icon mặc định
        dsThanhVien.forEach((member, index) => {
            const card = document.createElement('div');
            card.className = 'member-card';
            
            let avatarContent = member.avatar 
                ? `<img src="${member.avatar}" alt="${member.name}">` 
                : `👤`;

            card.innerHTML = `
                <div class="member-avatar">${avatarContent}</div>
                <h3>${member.name}</h3>
                <div class="member-id">STT ${index + 1}</div>
            `;
            grid.appendChild(card);
        });
    </script>

</body>
</html>
